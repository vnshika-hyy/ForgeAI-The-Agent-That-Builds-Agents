[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeai"
version = "0.1.0"
description = "A generic local agent factory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "pypdf>=5,<7",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
